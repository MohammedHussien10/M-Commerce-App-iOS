query QueryGetAddress($customerAccessToken: String!, $first: Int) {
     customer(customerAccessToken: $customerAccessToken) {
       addresses(first: $first) {
         __typename
         nodes {
           __typename
           address1
           address2
           city
           country
           id
           zip
           phone
         }
}
 __typename
       email
       firstName
       lastName
       phone
       id
       displayName
     }
}
